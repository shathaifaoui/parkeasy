# Option : lancer PostgreSQL avec Docker si vous ne l'avez pas installé.
#   docker compose up -d
# Les identifiants correspondent à backend/.env.example (postgres / postgres).
services:
  postgres:
    image: postgres:16
    container_name: parkeasy-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parkeasy
    ports:
      - "5432:5432"
    volumes:
      - parkeasy-data:/var/lib/postgresql/data
volumes:
  parkeasy-data:
